name: Movers scan

# Vercel's free (Hobby) plan caps native Cron Jobs at 2 runs/day, far too
# coarse for an intraday "today's movers" feature -- this workflow is the
# free workaround: GitHub Actions' own scheduler hits the site's protected
# cron route instead (see web/src/app/api/cron/movers-scan/route.ts).
#
# Required repo configuration (Settings -> Secrets and variables -> Actions):
#   Variable SITE_URL   -- e.g. https://your-project.vercel.app (no trailing slash)
#   Secret   CRON_SECRET -- must match the CRON_SECRET env var set on the Vercel project
#
# GitHub's scheduler is best-effort (can lag a few minutes under load, and
# schedules are auto-disabled after 60 days of repo inactivity) -- fine for
# this use case, not a substitute for a real-time feed.

on:
  schedule:
    # Every 20 min, 13:00-21:00 UTC (covers US pre-market through after-hours
    # across both EST and EDT), Monday-Friday.
    - cron: "*/20 13-21 * * 1-5"
  workflow_dispatch: {}

jobs:
  trigger:
    runs-on: ubuntu-latest
    steps:
      - name: Trigger movers scan
        env:
          SITE_URL: ${{ vars.SITE_URL }}
          CRON_SECRET: ${{ secrets.CRON_SECRET }}
        run: |
          if [ -z "$SITE_URL" ] || [ -z "$CRON_SECRET" ]; then
            echo "::error::SITE_URL (repo variable) or CRON_SECRET (repo secret) is not configured."
            exit 1
          fi
          curl -fsS --max-time 60 \
            -H "Authorization: Bearer ${CRON_SECRET}" \
            "${SITE_URL}/api/cron/movers-scan"
