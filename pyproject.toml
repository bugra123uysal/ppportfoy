[project]
name = "portfoy-takip-merkezi"
version = "1.0.0"
description = "Free personal portfolio tracking dashboard (Next.js + Flask + yfinance)"
requires-python = ">=3.11"

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-q"

[tool.ruff]
line-length = 100
target-version = "py311"

[tool.ruff.lint]
select = ["E", "F", "W", "I", "B", "UP", "S"]
ignore = ["S101"]  # assert in tests is fine

[tool.ruff.lint.per-file-ignores]
"portfoy/data.py" = ["BLE001"]
